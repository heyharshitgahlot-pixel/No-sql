services:
  mongo: { image: mongo:7, ports: ["27017:27017"], volumes: ["mongo-data:/data/db"] }
  redis: { image: redis:7-alpine, ports: ["6379:6379"] }
  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment: { CASSANDRA_CLUSTER_NAME: bca305p, CASSANDRA_DC: dc1, CASSANDRA_RACK: rack1 }
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment: { NEO4J_AUTH: neo4j/labpassword }
    volumes: ["neo4j-data:/data"]
volumes: { mongo-data: {}, neo4j-data: {} }
